services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prefstudio
      POSTGRES_PASSWORD: prefstudio
      POSTGRES_DB: prefstudio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefstudio"]
      interval: 2s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://prefstudio:prefstudio@db:5432/prefstudio
      # Lets the AI rater reach Ollama running on your machine.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
